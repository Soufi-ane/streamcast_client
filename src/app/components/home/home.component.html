<div *ngIf="authService.isLoggedIn(); else guestView" class="flex min-h-[calc(100vh-64px)]">
  <app-sidebar></app-sidebar>
  <div class="flex-1 bg-white"></div>
</div>

<ng-template #guestView>
  <div class="flex flex-col items-center justify-center min-h-[70vh] gap-4">
    <button
      class="w-48 py-3 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700"
      (click)="goToSignup()">
      Sign Up
    </button>
    <button
      class="w-48 py-3 rounded border border-gray-400 text-gray-800 font-semibold hover:bg-gray-100"
      (click)="goToLogin()">
      Login
    </button>
  </div>
</ng-template>
