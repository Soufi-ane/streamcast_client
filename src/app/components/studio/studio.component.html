<div class="flex min-h-[calc(100vh-64px)]">
  <app-sidebar></app-sidebar>

  <main class="flex-1 p-8">
    <div class="flex items-center justify-between pb-6 border-b border-gray-200">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">Channel Content</h2>
        <p class="text-sm text-gray-500 mt-1">Manage and upload your videos</p>
      </div>
      <button
        (click)="onUploadClick()"
        class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
        Upload Video
      </button>
    </div>

    <div *ngIf="videos.length === 0" class="flex flex-col items-center justify-center min-h-[50vh] text-center">
      <div class="w-16 h-16 mb-4 text-gray-400">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-full h-full">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2z" />
        </svg>
      </div>
      <p class="text-lg font-semibold text-gray-800">No videos uploaded yet</p>
      <p class="text-sm text-gray-500 mt-1 mb-4">Start sharing content by uploading your first video.</p>
      <button
        (click)="onUploadClick()"
        class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors">
        Upload
      </button>
    </div>
  </main>
</div>
