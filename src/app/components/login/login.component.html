<div class="flex flex-col items-center justify-center min-h-[70vh] px-4">
  <div class="w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Log in to your account</h2>
    <p *ngIf="errorMessage" class="text-red-600 text-sm text-center mb-4">{{ errorMessage }}</p>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-gray-700">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="mt-2 w-full py-3 rounded bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
        Log In
      </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
      Don't have an account?
      <span class="text-blue-600 cursor-pointer hover:underline" (click)="goToSignup()">Sign up</span>
    </p>
  </div>
</div>
